name: Build Simplified Chinese APK

on:
  push:
    branches:
      - octodroid-zh-cn
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OctoDroid-4.6.15-zh-CN.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoDroid-4.6.15-zh-CN
          path: OctoDroid-4.6.15-zh-CN.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view zh-cn-latest >/dev/null 2>&1; then
            gh release upload zh-cn-latest OctoDroid-4.6.15-zh-CN.apk --clobber
          else
            gh release create zh-cn-latest OctoDroid-4.6.15-zh-CN.apk \
              --target "${GITHUB_SHA}" \
              --title "OctoDroid 4.6.15 简体中文版" \
              --notes "基于 OctoDroid 4.6.15 的简体中文社区构建。使用个人访问令牌登录，已隐藏无效的 OAuth 登录入口。" \
              --latest
          fi
