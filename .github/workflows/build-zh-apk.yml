name: Build Simplified Chinese APK

on:
  push:
    branches:
      - octodroid-zh-cn
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test GitHub browser authorization
        env:
          OAUTH_CLIENT_ID: Ov23liBoCBw6OoTEBesL
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/json" \
            --data-urlencode "client_id=${OAUTH_CLIENT_ID}" \
            --data-urlencode "scope=user repo gist read:org notifications" \
            https://github.com/login/device/code)"
          echo "${response}" | jq -e \
            '.device_code and .user_code and (.verification_uri == "https://github.com/login/device")' \
            >/dev/null

      - name: Prepare fixed APK signing
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          echo "${SIGNING_KEY}" | base64 --decode > app/octodroid-zh.jks
          {
            echo "STORE_FILE=octodroid-zh.jks"
            echo "STORE_PASSWORD=${SIGNING_PASSWORD}"
            echo "KEY_ALIAS=octodroid"
            echo "KEY_PASSWORD=${SIGNING_PASSWORD}"
          } > signing.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OctoDroid-4.6.15-zh-CN.apk

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK on Android 15 emulator
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          "${SDKMANAGER}" "platform-tools" "emulator" \
            "system-images;android-35;google_apis;x86_64" >/dev/null
          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${PATH}"
          echo no | "${AVDMANAGER}" create avd \
            --name octodroid-smoke \
            --package "system-images;android-35;google_apis;x86_64" \
            --force
          nohup "${EMULATOR}" -avd octodroid-smoke \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on \
            > /tmp/octodroid-emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c \
            'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb install -r OctoDroid-4.6.15-zh-CN.apk
          adb logcat -c
          adb shell am start -W \
            -n com.gh4a.debug/com.gh4a.activities.Github4AndroidActivity
          sleep 8
          test -n "$(adb shell pidof com.gh4a.debug | tr -d "\r")"
          adb shell uiautomator dump /sdcard/octodroid-window.xml
          adb pull /sdcard/octodroid-window.xml /tmp/octodroid-window.xml >/dev/null
          grep -q 'com.gh4a.debug:id/login_button' /tmp/octodroid-window.xml
          if adb logcat -d | grep -A 20 'FATAL EXCEPTION' | grep -q 'com.gh4a'; then
            adb logcat -d
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoDroid-4.6.15-zh-CN
          path: OctoDroid-4.6.15-zh-CN.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="4.6.15-zh.${GITHUB_RUN_NUMBER}"
          VERSION_TAG="zh-cn-${VERSION_NAME}"
          RELEASE_NOTES="基于 OctoDroid 4.6.15 的简体中文社区构建。版本 ${VERSION_NAME}，支持 GitHub 网页授权登录，并保留个人访问令牌登录。"

          # Keep a stable URL for in-place updates and links in the README.
          if gh release view zh-cn-latest >/dev/null 2>&1; then
            gh release upload zh-cn-latest OctoDroid-4.6.15-zh-CN.apk --clobber
            gh release edit zh-cn-latest \
              --title "OctoDroid ${VERSION_NAME} 简体中文版" \
              --notes "${RELEASE_NOTES}"
          else
            gh release create zh-cn-latest OctoDroid-4.6.15-zh-CN.apk \
              --target "${GITHUB_SHA}" \
              --title "OctoDroid ${VERSION_NAME} 简体中文版" \
              --notes "${RELEASE_NOTES}"
          fi

          # Create a visible, versioned release for every successful build.
          if gh release view "${VERSION_TAG}" >/dev/null 2>&1; then
            gh release upload "${VERSION_TAG}" OctoDroid-4.6.15-zh-CN.apk --clobber
            gh release edit "${VERSION_TAG}" \
              --title "OctoDroid ${VERSION_NAME} 简体中文版" \
              --notes "${RELEASE_NOTES}" \
              --latest
          else
            gh release create "${VERSION_TAG}" OctoDroid-4.6.15-zh-CN.apk \
              --target "${GITHUB_SHA}" \
              --title "OctoDroid ${VERSION_NAME} 简体中文版" \
              --notes "${RELEASE_NOTES}" \
              --latest
          fi
